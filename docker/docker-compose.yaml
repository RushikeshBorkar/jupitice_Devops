services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - /home/rushikesh-borkar/dockercompose/artemis/mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword
      UPLOAD_LIMIT: 250M
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5673:5672"   # Changed from 5672 to 5673
      - "15673:15672" # Changed from 15672 to 15673
    networks:
      - app_network

  nodeapp:
    build:
      context: .  # Path to your Node.js app directory
      dockerfile: Dockerfile
    container_name: node_app
    restart: unless-stopped
    ports:
      - "3000:3000"  # Map your app's port
    volumes:
      - ./config/user-local.json:/app/config/user-local.json  # Mount your config file
    depends_on:
      - mysql
      - redis
      - rabbitmq
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
