apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: artemis
  name: artemis-deployment
spec:
  scaleTargetRef:
    apiVersion: apps/v1beta1
    kind: Deployment
    name: artemis-deployment
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: "Utilization"
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: "Utilization"
          averageUtilization: 80
