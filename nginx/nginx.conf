server {
server_name revenue-court-haryana.jupitice.com;
location / {
    resolver 8.8.8.8 ipv6=off;
    proxy_pass http://localhost:8080;
   proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600;
    proxy_set_header  X-Forwarded-For $remote_addr;
   set $args $args&host=$http_host;
    proxy_set_header Host      $host;
    proxy_set_header X-Forwarded-Port $server_port;
   
 }
    location ~ /\. {
    deny all;
}


    listen 443 http2 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jupitice.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jupitice.com/privkey.pem; # managed by Certbot
#    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
#    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = revenue-court-haryana.jupitice.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



listen 80;
server_name revenue-court-haryana.jupitice.com;
    return 404; # managed by Certbot


}
